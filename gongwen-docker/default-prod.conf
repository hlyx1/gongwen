# 公文排版工具 - 生产 nginx 配置（烘焙进前端镜像 /etc/nginx/conf.d/default.conf）
# 本文件属 conf.d 级（被镜像主 nginx.conf 的 http 块 include），gzip 等指令写在文件顶部＝http 级生效。
# 改本文件必须重打前端镜像（只改 compose 或只 reload 不会生效）——SSE 反代等关键语义都在此。

# Gzip 压缩
gzip  on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

server {
    listen       80;
    server_name  localhost;

    # 网站根目录
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # --- Location /llm/ （AI 校对同源入口，前缀即部署面契约——与 vite dev 代理的 /llm 前缀同名）---
    # 经外部网络 vllm-proxy-net 直连 vllm-proxy 容器（OpenAI 兼容网关，按请求体 model
    # 别名路由多后端——底层 vLLM 引擎不直接对外）。
    # prod 体例直连容器名：字面量 proxy_pass 走启动期 Docker DNS 解析，vllm-proxy 未起则
    # nginx 容器起不来（部署 README 起序钉死先起 vllm-proxy）。
    # 尾斜杠 URI 剥离前缀：/llm/v1/chat/completions -> 上游 /v1/chat/completions
    # （与 vite dev 代理的 rewrite 去前缀语义一致）。
    # SSE 长流：proxy_buffering off 必须（默认缓冲攒整响应再吐，打字机流全毁）；
    # proxy_read_timeout 600s（长思考生成远超默认 60s）；
    # proxy_http_version 1.1 + Connection "" 是 SSE 反代标准配套（上游 keep-alive 流式）。
    # 浏览器同源请求，无 CORS 面。
    location /llm/ {
        proxy_pass http://vllm-proxy:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --- API 反向代理 - 统计服务（容器名直连，compose 服务 gongwen-stats）---
    # X-Real-IP 取宿主 nginx 透传的头（生产对外入口是宿主 nginx :88 → 127.0.0.1:50088，
    # 直连容器时 $remote_addr 只是宿主/网关 IP，统计按 IP 算单位排名需真实客户端 IP）
    location /api {
        proxy_pass http://gongwen-stats:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # --- runtime-config.js：运行时部署配置，no-cache ---
    # 容器每次启动由 /docker-entrypoint.d/40-runtime-config.sh 按 AI_* env 重新生成；
    # 精确匹配 location 优先于下方 js 正则缓存块；no-cache 强制每次协商回源，
    # 防浏览器启发式缓存把改 env 后的旧配置锁死多日。
    location = /runtime-config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PWA 相关文件不缓存
    location ~* (sw\.js|manifest\.json|workbox.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA 路由支持 - 所有路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 错误页面
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
