# 公文排版工具 - Docker Compose 配置
# 使用方法：
#   1. 先在项目根目录构建：npm run build
#   2. 启动容器：docker-compose up -d --build（会自动使用本地的 dist 目录）

services:
  gongwen:
    image: gongwen-web:1.0.1
    build:
      context: ..
      dockerfile: gongwen-docker/Dockerfile
    container_name: gongwen-web
    ports:
      - "88:80"
    volumes:
      # 挂载 nginx 配置文件
      - ./nginx-dev.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - gongwen-stats
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  gongwen-stats:
    image: gongwen-stats:1.0.0
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gongwen-stats
    volumes:
      # 挂载数据目录，日志持久化到宿主机
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
