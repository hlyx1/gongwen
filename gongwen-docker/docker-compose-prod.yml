# 公文排版工具 - Docker Compose 配置
# 使用方法：docker-compose up -d --build

services:
  gongwen:
    image: gongwen-web:1.0.0
    container_name: gongwen-web
    ports:
      - "88:80"
    volumes:
      # 挂载 nginx 配置文件
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - gongwen-stats
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  gongwen-stats:
    image: gongwen-stats:1.0.0
    container_name: gongwen-stats
    volumes:
      # 挂载数据目录，日志持久化到宿主机
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
