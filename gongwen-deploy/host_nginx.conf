# 宿主机 Nginx 配置文件 - 公文排版工具（gongwen）
# 对应 /etc/nginx/sites-available/gongwen
# 宿主 nginx 统一对外入口（:88），转发到 Docker 容器映射的宿主端口 50088（容器内 80）。
# 用途：透传真实客户端 IP（容器内 nginx 直连会丢真实 IP，统计按 IP 算单位排名）。

server {
    # 监听宿主机端口 88
    listen       88;
    server_name  _;

    # 所有请求转发到 Docker 内 nginx（宿主机端口 50088）
    location / {
        proxy_pass         http://127.0.0.1:50088;

        # 传递真实客户端 IP 到 Docker 内 nginx
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
